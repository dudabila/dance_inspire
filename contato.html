<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contato | Dance Inspire</title>

    <!-- SEO -->
    <meta name="description" content="Entre em contato com o Dance Inspire para dúvidas, sugestões ou para compartilhar sua experiência com a dança.">
    <meta name="keywords" content="contato dance inspire, fale conosco, blog de dança">
    <meta name="author" content="Duda">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body>
    <header>

    <h1>Dance Inspire</h1>

    <nav>

        <a href="index.html">Home</a>
        <a href="artigos.html">Artigos</a>
        <a href="sobre.html">Minha História</a>
        <a href="contato.html">Contato</a>

    </nav>

</header>
<main>

    <section class="titulo-pagina">

        <h2>Entre em Contato</h2>

        <p>
            Tem alguma dúvida, sugestão ou quer compartilhar sua experiência com a dança?
            Envie uma mensagem!
        </p>

    </section>

    <section class="contato">

        <form id="formContato">

            <div class="campo">

                <label for="nome">Nome</label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome"
                >

            </div>

            <div class="campo">

                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                >

            </div>

            <div class="campo">

                <label for="mensagem">Mensagem</label>

                <textarea
                    id="mensagem"
                    rows="6"
                    placeholder="Escreva sua mensagem..."
                ></textarea>

            </div>

            <button type="submit" class="botao">

                Enviar Mensagem

            </button>

            <div id="feedbackFormulario" class="feedback-formulario"></div>

        </form>

    </section>

</main>

<footer>

    <p>&copy; 2026 Dance Inspire | Todos os direitos reservados.</p>

</footer>

<script src="js/script.js"></script>

</body>

</html>
